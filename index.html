<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <div class="brand">
        <img
         src="https://images.cults3d.com/FejSa6B3RsuGur1bYcXOqZcrjKs=/516x516/filters:no_upscale()/https://fbi.cults3d.com/uploaders/17139675/illustration-file/a451ba3c-2f48-4f19-897b-e64701f3d7e5/Capture.jpg"
         alt="Logo PokeShop"
         class="brand-mark"
         /> 
     <span>PokeShop</span>
     </div>

        <div class="header">
          <p class="eyebrow">Tienda de cartas Pokemon</p>
          <h1>Crear cuenta</h1>
        </div>

        <form class="form">
          <div class="field">
            <label for="name">Nombre</label>
            <input id="name" type="text" placeholder="Tu nombre" />
          </div>

          <div class="field">
            <label for="email">Correo</label>
            <input id="email" type="email" placeholder="correo@ejemplo.com" />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="••••••••" />
          </div>

          <div class="field">
            <label for="confirm-password">Confirmar contraseña</label>
            <input id="confirm-password" type="password" placeholder="Repite tu contraseña" />
          </div>

          <form class="form">
          <div class="field">
            <label for="name">Cual es tu Pokemon Favorito?</label>
            <input id="name" type="text" placeholder="Nombre de tu pokemon" />
          </div>

          <form class="form">
          <div class="field">
            <label for="name">Que tipos de pokemones prefieres?</label>
            <input id="name" type="text" placeholder="Nombre de tu elemento" />
          </div>

          <button type="submit">Registrarse</button>
        </form>

        <p class="login-text">
          Ya tienes una cuenta?
          <a href="#">Inicia sesión</a>
        </p>
      </section>
    </main>
  </body>
</html>
