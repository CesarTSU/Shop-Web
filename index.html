<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="flex-container">
      
      <main class="page">
        <section class="card">
          <div class="brand">
            <img
              src="https://images.cults3d.com/FejSa6B3RsuGur1bYcXOqZcrjKs=/516x516/filters:no_upscale()/https://fbi.cults3d.com/uploaders/17139675/illustration-file/a451ba3c-2f48-4f19-897b-e64701f3d7e5/Capture.jpg"
              alt="Logo PokeShop"
              class="brand-mark"
            />
            <span>PokeShop</span>
          </div>

          <div class="header">
            <p class="eyebrow">Tienda de cartas Pokemon</p>
            <h1>Crear cuenta</h1>
          </div>

          <form id="formulario1" class="form">
            <div class="field">
              <label for="name">Nombre</label>
              <input id="name" type="text" placeholder="Tu nombre" />
            </div>

            <div class="field">
              <label for="email">Correo</label>
              <input id="email" type="email" placeholder="correo@ejemplo.com" />
            </div>

            <div class="field">
              <label for="password">Contraseña</label>
              <input id="password" type="password" placeholder="••••••••" />
            </div>

            <div class="field">
              <label for="confirm-password">Confirmar contraseña</label>
              <input id="confirm-password" type="password" placeholder="Repite tu contraseña" />
            </div>

            <div class="checkbox-group-container">
              <label class="group-label">¿Cuál es tu Pokemon inicial favorito de kanto?</label>
              <div class="checkbox-options">
                <label class="checkbox-label">
                  <input type="checkbox" name="pokemon-favorito" value="bulbasaur" /> Bulbasaur
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="pokemon-favorito" value="charmander" /> Charmander
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="pokemon-favorito" value="squirtle" /> Squirtle
                </label>
              </div>
            </div>

            <div class="input-container">
              <label for="region-pokemon">¿Cuál es tu región favorita?</label>
              <div class="select-wrapper">
                <select id="region-pokemon" name="region-pokemon">
                  <option value="" disabled selected>Selecciona una región</option>
                  <option value="kanto">Kanto</option>
                  <option value="johto">Johto</option>
                  <option value="hoenn">Hoenn</option>
                  <option value="sinnoh">Sinnoh</option>
                  <option value="unova">Unova</option>
                </select>
              </div>
            </div>
          </form>
        </section>
      </main>

      <main class="page">
        <section class="card">
          <div class="brand">
            <img
              src="https://images.cults3d.com/FejSa6B3RsuGur1bYcXOqZcrjKs=/516x516/filters:no_upscale()/https://fbi.cults3d.com/uploaders/17139675/illustration-file/a451ba3c-2f48-4f19-897b-e64701f3d7e5/Capture.jpg"
              alt="Logo PokeShop"
              class="brand-mark"
            />
            <span>PokeShop</span>
          </div>

          <div class="header">
            <p class="eyebrow">Tienda de cartas Pokemon</p>
            <h1>Información Adicional</h1>
          </div>

          <form id="formulario2" class="form">
            <div class="field">
              <label for="card-type">¿Qué tipo de cartas buscas?</label>
              <input id="card-type" type="text" placeholder="Ej: Ultra Raras, Holo..." />
            </div>

            <div class="checkbox-group-container">
              <label class="group-label">¿Te Gustaria participar en sorteos de cartas??</label>
              <div class="checkbox-options">
                <label class="checkbox-label">
                  <input type="checkbox" name="Si" value="Si" /> Si
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="No" value="No" /> No
              </div>
            </div>

            <div class="input-container">
              <label for="coleccionar">¿Que sueles coleccionar?</label>
              <div class="select-wrapper">
                <select id="coleccionar" name="coleccionar">
                  <option value="" disabled selected>Seleccione sus preferencias</option>
                  <option value="kanto">Cartas</option>
                  <option value="johto">Figuras</option>
                  <option value="hoenn">Peluches</option>
                  <option value="sinnoh">Merchandising</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn-submit">Registrarse</button>
            <p class="login-text">
              ¿Ya tienes una cuenta?
              <a href="#">Inicia sesión</a>
            </p>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
